# Pinned to what is installed in mywork2_rebuild_env, the environment the notebooks were run in
# (parity PASS for notebooks 00, 01, 07 on 2026-09-20). Direct dependencies only; the solver fills in the rest.
name: mywork2_rebuild_env
channels:
  - conda-forge
dependencies:
  - python=3.8.12
  # src/swb and notebooks 00, 01, 07
  - pandas=2.0.0
  - numpy=1.24.2
  - scipy=1.10.1
  - statsmodels=0.14.1
  - matplotlib-base=3.7.1
  - seaborn=0.13.2
  - pyarrow=16.1.0
  - scikit-allel=1.3.7
  - tqdm=4.67.1
  - pytest=7.4.4
  # Jupyter
  - ipykernel=6.26.0
  - notebook=6.4.8
  # imported by the legacy notebook: needed when the remaining analyses are migrated
  - scikit-learn=1.2.2
  - scikit-image=0.19.3
  - pingouin=0.5.5
  - matplotlib-venn=1.1.1
  - xgboost=2.1.1
  - python-louvain=0.16
  - pip
  - pip:
      - jupyterlab==4.3.8
      - plotly==6.1.2
      - venn==0.1.3
